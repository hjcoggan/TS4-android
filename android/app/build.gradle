plugins {
    id 'com.android.application' version '8.13.0'
}

def rexsdkDir = (project.findProperty('rexsdkDir') ?: new File(rootDir, '../../work/rexglue-sdk').canonicalPath).toString()
def ts4WithRexglue = (project.findProperty('ts4WithRexglue') ?: 'OFF').toString()

android {
    namespace 'com.ts4port.topspin4'
    compileSdk 36

    buildFeatures { buildConfig true }

    ndkVersion '30.0.16248370'

    defaultConfig {
        applicationId 'com.ts4port.topspin4'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a'
                arguments '-DANDROID_STL=c++_shared',
                          "-DTS4_WITH_REXGLUE=${ts4WithRexglue}",
                          "-DREXSDK_DIR=${rexsdkDir}"
            }
        }
    }

    buildTypes {
        profile {
            // Debuggable so debuggerd can attach and unwind native threads; the native code is
            // still RelWithDebInfo/-O2, so it is fast. Debug builds are too slow for testing.
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
            buildConfigField 'String', 'REX_RUNTIME_LIBRARY', '\"rexruntimerd\"'
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo',
                              '-DREXGLUE_RECOMP_DEBUG_INFO=none',
                              // The SDK's perf counters wrap hot paths (command processing, memory)
                              // in clock_gettime scopes. A simpleperf profile of the cinematic put
                              // 41% of all cycles in __kernel_clock_gettime because of them.
                              '-DREXGLUE_ENABLE_PERF_COUNTERS=OFF'
                }
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'REX_RUNTIME_LIBRARY', '\"rexruntime\"'
        }
        debug {
            minifyEnabled false
            buildConfigField 'String', 'REX_RUNTIME_LIBRARY', '\"rexruntimed\"'
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
        }
    }

    sourceSets {
        main {
            // Reuse SDL3's Android Java glue from the SDK submodule instead of
            // copying it into this project.
            java.srcDirs += "${rexsdkDir}/thirdparty/sdl3/android-project/app/src/main/java"
        }
    }

    lint {
        abortOnError false
    }

    packaging {
        jniLibs {
            // Real .so files on disk are required for adrenotools/Turnip
            // (libvulkan proxy) and for ndk-stack symbolication.
            useLegacyPackaging = true
            keepDebugSymbols += "**/*.so"
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
