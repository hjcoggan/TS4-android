plugins {
    id 'com.android.application' version '8.13.0'
}

def rexsdkDir = (project.findProperty('rexsdkDir') ?: new File(rootDir, '../../work/rexglue-sdk').canonicalPath).toString()
def ts4WithRexglue = (project.findProperty('ts4WithRexglue') ?: 'OFF').toString()

android {
    namespace 'com.ts4port.topspin4'
    compileSdk 36

    ndkVersion '30.0.16248370'

    defaultConfig {
        applicationId 'com.ts4port.topspin4'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a'
                arguments '-DANDROID_STL=c++_shared',
                          "-DTS4_WITH_REXGLUE=${ts4WithRexglue}",
                          "-DREXSDK_DIR=${rexsdkDir}"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
        }
    }

    sourceSets {
        main {
            // Reuse SDL3's Android Java glue from the SDK submodule instead of
            // copying it into this project.
            java.srcDirs += "${rexsdkDir}/thirdparty/sdl3/android-project/app/src/main/java"
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
