# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx4096m
android.useAndroidX=true
android.nonTransitiveRClass=true

# Path to the ReXGlue SDK working copy (contains thirdparty/sdl3).
# Defaults to ../../work/rexglue-sdk (beside ts4-port).
# Override on the command line with -PrexsdkDir=...

# Enable ReXGlue SDK integration in the native build. Default OFF: the SDK is
# unverified on Android and the port currently builds a stub library.
# Override with -Pts4WithRexglue=ON.
ts4WithRexglue=OFF
