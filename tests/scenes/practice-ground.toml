# Boot -> intro skipped -> Loader's title screen -> START (Swing loads the practice ground), then
# rests there: the court from the broadcast camera with no player input, the same point as
# scripts/input/edge-boot-to-practice.txt on the Oracle. Used for the image-quality court crops.
# Run: python scripts/scene_runner.py tests/scenes/practice-ground.toml --runs 0 --native 1 --dual 1

name = "practice-ground"
from = "boot"

# Scripted pad (src/script_input.h grammar); `at` anchors to guest frames, +-1.
input = """
# The intro videos and the 2K logos skip on START (keystrokes).
at 1
press START
at 70
press START
at 140
press START
at 210
press START
at 280
press START
at 350
press START
# The title screen is up from about frame 350.
at 500
press START
"""

# label and crops: what scripts/scene_runner_shots.py shows on its before-and-after page
# (crop boxes are fractions of the frame: x, y, width, height). Frame 1300 has an Oracle frame
# of the same scene point (analysis/scenes/iq02/edge-practice-original).
[[capture]]  # practice ground, the ball machine prompt
frame = 1300
label = "practice ground, the ball machine prompt"
crops = [
  { name = "net", box = [0.19, 0.32, 0.31, 0.12] },
  { name = "near baseline and corner", box = [0.08, 0.65, 0.25, 0.21] },
  { name = "player, racket and shadow", box = [0.47, 0.63, 0.17, 0.24] },
  { name = "ball machine", box = [0.47, 0.09, 0.09, 0.13] },
  { name = "shot helper text", box = [0.05, 0.05, 0.20, 0.24] },
]
[[capture]]
frame = 1600
label = "practice ground, a moment later"
