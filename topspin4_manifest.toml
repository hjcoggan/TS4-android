name = "topspin4"
sdk_version = "0.10.0"
game_root = "assets"

# Boot (default.xex, v0.0.1.3 with TU1).
[entrypoint]
file_path = "assets/default.xex"
out_directory_path = "generated/boot"
includes = []

# Loader (Loader_DLL.xex, v0.0.1.3 with TU1): its own host library, which Boot loads
# through XexLoadImage.
