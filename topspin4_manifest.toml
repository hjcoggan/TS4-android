# Created for ReXGlue v0.10.0; the function seeds below are maintained by hand.
# Input: the Reference build (ADR-0002), prepared in assets/ by scripts/build.ps1 -Action Codegen.

[project]
name = "topspin4"
sdk_version = "0.10.0"
game_root = "assets"

# Boot (default.xex, v0.0.1.3 with TU1).
[entrypoint]
file_path = "assets/default.xex"
out_directory_path = "generated/boot"
includes = []

# Loader (Loader_DLL.xex, v0.0.1.3 with TU1): its own host library, which Boot loads
# through XexLoadImage.
[[modules]]
file_path = "assets/Loader_DLL.xex"
guest_path = "Loader_DLL.xex"
out_directory_path = "generated/loader"
includes = []
# The CRT's setjmp and longjmp (the libjpeg in XUI recovers from decode errors with them).
# setjmp checks a hook pointer, then stores f14-f31, r13-r31 and v64-v127 at r3; longjmp
# reloads the same layout from r3 and returns r4 (1 for 0).
setjmp_address = 0x8346A940
longjmp_address = 0x8346A510

# Seed addresses for functions the v0.10.0 discovery pass misses; analysis finds their bounds.
[modules.functions]
# Tail stubs (one "b 0x83183418", then padding) reached only by a branch from a this-adjusting
# thunk ("addi r3,r3,-32; b stub"); discovery leaves them outside any function.
